[build-system]
requires      = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name            = "csv-to-excel"
version         = "1.0.0"
description     = "Convert CSV data to styled Excel workbooks"
requires-python = ">=3.10"
dependencies    = [
    "openpyxl>=3.1.0",
    "Pillow>=10.0.0",
]

[project.scripts]
csv2excel  = "csv2excel.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["csv2excel*"]
